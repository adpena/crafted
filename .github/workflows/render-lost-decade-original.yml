name: Render original Lost Decade report pages

on:
  push:
    branches:
      - tmp/lost-decade-original-pages-20260813

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PDF and HTML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Resolve live publisher PDF, download, and render
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          REPORTS_PAGE="https://www.texasaft.org/our-priorities/legislative-agenda"
          google-chrome --headless --no-sandbox --disable-gpu \
            --virtual-time-budget=15000 --dump-dom "$REPORTS_PAGE" > out/reports-page.html

          python - <<'PY'
          from bs4 import BeautifulSoup
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re

          page_url = "https://www.texasaft.org/our-priorities/legislative-agenda"
          html = Path("out/reports-page.html").read_text(errors="replace")
          soup = BeautifulSoup(html, "html.parser")
          rows = []
          for a in soup.find_all("a", href=True):
              text = " ".join(a.stripped_strings)
              href = unescape(a.get("href", ""))
              rows.append({"text": text, "href": urljoin(page_url, href)})
          Path("out/all-links.json").write_text(json.dumps(rows, indent=2))

          candidates = []
          for row in rows:
              hay = (row["text"] + " " + row["href"]).lower()
              if "lost decade" in hay or "lost-decade" in hay:
                  candidates.append(row)
          Path("out/lost-decade-links.json").write_text(json.dumps(candidates, indent=2))

          # Prefer the link whose visible label is the report filename, then any PDF-like URL.
          selected = None
          for row in candidates:
              if "report.pdf" in row["text"].lower() or row["href"].lower().endswith(".pdf"):
                  selected = row["href"]
                  break
          if not selected:
              # Wix occasionally stores document URLs in serialized page data rather than anchors.
              decoded = unescape(html).replace(r"\u002F", "/").replace(r"\/", "/")
              urls = re.findall(r'https?://[^"\'<>\\ ]+', decoded)
              for url in urls:
                  low = url.lower()
                  if ("lost" in low and "decade" in low) or ("_files/ugd/" in low and ".pdf" in low):
                      selected = url.rstrip('),;')
                      break
          if not selected:
              raise SystemExit("Could not resolve the live Lost Decade PDF URL; diagnostics were saved.")
          Path("out/resolved-url.txt").write_text(selected + "\n")
          print(selected)
          PY

          PDF_URL="$(cat out/resolved-url.txt)"
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "Mozilla/5.0" "$PDF_URL" --output original.pdf
          test "$(head -c 4 original.pdf)" = "%PDF"
          pdfinfo original.pdf | tee out/pdfinfo.txt
          pdftoppm -png -r 300 original.pdf out/page
          cp original.pdf out/The-Lost-Decade-and-a-half-original.pdf
          sha256sum original.pdf out/page-*.png | tee out/SHA256SUMS.txt

      - name: Upload exact source, rendered pages, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-decade-original-pages
          path: out/
          if-no-files-found: error
          retention-days: 1
