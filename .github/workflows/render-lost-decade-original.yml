name: Render original Lost Decade report pages

on:
  push:
    branches:
      - tmp/lost-decade-original-pages-20260813

concurrency:
  group: render-lost-decade-original-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download and render exact Wix-hosted report
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          PDF_URL="https://www.texasaft.org/_files/ugd/7d2bef_26361683a175403a992893470484390b.pdf"
          printf '%s\n' "$PDF_URL" > out/resolved-url.txt
          printf '%s\n' "Texas AFT Wix document upload identified from the live legislative-agenda page" > out/resolved-source.txt
          timeout 70s curl --fail --location --connect-timeout 10 --max-time 65 \
            --retry 3 --retry-all-errors --user-agent "Mozilla/5.0" \
            "$PDF_URL" --output original.pdf
          test "$(head -c 4 original.pdf)" = "%PDF"
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo original.pdf | tee out/pdfinfo.txt
          test "$(pdfinfo original.pdf | awk '/^Pages:/ {print $2}')" = "3"
          pdftoppm -png -r 300 original.pdf out/page
          cp original.pdf out/The-Lost-Decade-and-a-half-original.pdf
          sha256sum original.pdf out/page-*.png | tee out/SHA256SUMS.txt

      - name: Upload exact source and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-decade-original-pages
          path: out/
          if-no-files-found: error
          retention-days: 1
