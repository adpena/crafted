name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-tests:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked repository dependencies
        run: npm ci
      - name: Run plugin tests
        run: npx vitest run plugin/tests

  site-build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Check site and plugin types
        run: npm run typecheck
      - name: Run site and plugin unit tests
        run: npm test
      - name: Check backup restoration and migrations
        run: npm run test:backup
      - name: Build site
        run: npm run build

  e2e:
    name: Portfolio browser checks
    runs-on: ubuntu-latest
    needs: site-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build native SQLite dependency for EmDash CLI
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Seed an isolated portfolio preview
        run: npm run preview:seed
      - name: Run portfolio browser checks
        run: npm run test:e2e:portfolio
        env:
          PORTFOLIO_TEST_STATE: .portfolio-release/test-state
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: site-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build native SQLite dependency for EmDash CLI
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Seed an isolated portfolio preview
        run: npm run preview:seed
      - name: Build site
        run: npm run build
      - name: Audit built portfolio on desktop and mobile
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
